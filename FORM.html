<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms</title>
</head>
<body>
    <fieldset>
        <form action="#" name="#" target="#" method="#">
            <label for="Name">Username:</label>
            <input type="text" name="Name" id="Name" placeholder="Enter your Name">
<br>
<br>
            <label for="Password">password:</label>
            <input type="Password" name="Password" id="Password" placeholder="Enter your Password">

<br>
<br>
            <label for="Email">email:</label>
            <input type="Email" name="Email" id="Email" placeholder="Enter your Email">
<br>
<br>
            <label for="Gender">Gender:</label>
            <input type="radio" name="Gender" id="Gender">
            <label for="Gender">Male</label>
            <input type="radio" name="Gender" id="Gender">
            <label for="Gender">Female</label>

<br>
<br>
            <label for ="hobby">Hobby:</label>
            <input type="checkbox" name="hobby 1" id="hobby 1">
            <label for="hobby">Cricket</label>
            <input type="checkbox" name="hobby 2" id="hobby 2">
            <label for="hobby 2">Football</label>
<br>
<br>
            <label for="DOB">DOB:</label>
            <input type="date" name="DOB" id="DOB">
<br>
<br>
  <label for="select programming language">select programming language:</label>
            <select name="select programming language" id="select programming language">
                
                <option value="C">C</option>
                <option value="C++">C++</option>
                <option value="Java">Java</option>
                <option value="Python">Python</option>
    </fieldset>
    
</body>
</html>
